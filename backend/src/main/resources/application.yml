server:
  port: 8080

spring:
  application:
    name: ai-knowledge-base
  datasource:
    url: jdbc:postgresql://43.136.175.16:5432/ai_kb
    username: postgres
    password: PgVector@2026
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

langchain4j:
  open-ai:
    chat-model:
      api-key: sk-d8cebffe71ad40678a540c2f019bd7dc
      model-name: deepseek-chat
      temperature: 0.7
      max-tokens: 2048
      timeout: 120s
      max-retries: 2
      log-requests: true
      log-responses: true
    embedding-model:
      api-key: sk-d8cebffe71ad40678a540c2f019bd7dc
      model-name: text-embedding-3-small
      timeout: 60s
      max-retries: 2

app:
  vector-store:
    table: vector_store
    dimension: 1536
    index-type: hnsw
  document:
    chunk-size: 800
    chunk-overlap: 100
    supported-formats:
      - pdf
      - md
      - txt
      - docx
      - html
  rag:
    top-k: 5
    score-threshold: 0.5

logging:
  level:
    com.example.aikb: DEBUG
    dev.langchain4j: DEBUG
